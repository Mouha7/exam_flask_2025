{% extends 'base.html' %} {% block title %}Nouvelle recette{% endblock %} {%
block content %}
<div class="max-w-4xl mx-auto">
	<div class="bg-white rounded-lg shadow-lg overflow-hidden">
		<div class="bg-gradient-to-r from-blue-600 to-blue-700 px-6 py-4">
			<h3 class="text-xl font-bold text-white">
				Créer une nouvelle recette
			</h3>
		</div>
		<div class="p-6">
			<form
				method="POST"
				action="{{ url_for('recipe_create') }}"
				enctype="multipart/form-data"
			>
				<!-- Titre -->
				<div class="mb-5">
					<label
						for="title"
						class="block text-sm font-medium text-gray-700 mb-1"
						>Titre</label
					>
					<input
						type="text"
						class="w-full rounded-md border-gray-300 shadow-sm focus:border-blue-500 focus:ring focus:ring-blue-500 focus:ring-opacity-50"
						id="title"
						name="title"
						required
					/>
				</div>

				<!-- Description -->
				<div class="mb-5">
					<label
						for="description"
						class="block text-sm font-medium text-gray-700 mb-1"
						>Description</label
					>
					<textarea
						class="w-full rounded-md border-gray-300 shadow-sm focus:border-blue-500 focus:ring focus:ring-blue-500 focus:ring-opacity-50"
						id="description"
						name="description"
						rows="3"
						required
					></textarea>
				</div>

				<!-- Temps et difficulté -->
				<div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-5">
					<div>
						<label
							for="cooking_time"
							class="block text-sm font-medium text-gray-700 mb-1"
							>Temps de préparation (minutes)</label
						>
						<input
							type="number"
							class="w-full rounded-md border-gray-300 shadow-sm focus:border-blue-500 focus:ring focus:ring-blue-500 focus:ring-opacity-50"
							id="cooking_time"
							name="cooking_time"
							min="1"
							required
						/>
					</div>
					<div>
						<label
							for="difficulty"
							class="block text-sm font-medium text-gray-700 mb-1"
							>Difficulté</label
						>
						<select
							class="w-full rounded-md border-gray-300 shadow-sm focus:border-blue-500 focus:ring focus:ring-blue-500 focus:ring-opacity-50"
							id="difficulty"
							name="difficulty"
							required
						>
							<option value="">Choisir...</option>
							<option value="Facile">Facile</option>
							<option value="Moyen">Moyen</option>
							<option value="Difficile">Difficile</option>
						</select>
					</div>
				</div>

				<!-- Ingrédients -->
				<div class="mb-5">
					<label
						for="ingredients"
						class="block text-sm font-medium text-gray-700 mb-1"
						>Ingrédients</label
					>
					<textarea
						class="w-full rounded-md border-gray-300 shadow-sm focus:border-blue-500 focus:ring focus:ring-blue-500 focus:ring-opacity-50"
						id="ingredients"
						name="ingredients"
						rows="6"
						placeholder="Listez vos ingrédients (un par ligne)"
						required
					></textarea>
					<p class="mt-1 text-xs text-gray-500">
						Listez un ingrédient par ligne avec les quantités.
					</p>
				</div>

				<!-- Instructions -->
				<div class="mb-5">
					<label
						for="instructions"
						class="block text-sm font-medium text-gray-700 mb-1"
						>Instructions</label
					>
					<textarea
						class="w-full rounded-md border-gray-300 shadow-sm focus:border-blue-500 focus:ring focus:ring-blue-500 focus:ring-opacity-50"
						id="instructions"
						name="instructions"
						rows="8"
						placeholder="Décrivez les étapes (une par ligne)"
						required
					></textarea>
					<p class="mt-1 text-xs text-gray-500">
						Décrivez chaque étape sur une nouvelle ligne.
					</p>
				</div>

				<!-- Image -->
				<div class="mb-6">
					<label
						for="image"
						class="block text-sm font-medium text-gray-700 mb-1"
						>Image</label
					>
					<div class="mt-1 flex items-center">
						<span
							class="inline-block h-12 w-12 rounded-md overflow-hidden bg-gray-100"
						>
							<svg
								class="h-full w-full text-gray-300"
								fill="currentColor"
								viewBox="0 0 24 24"
							>
								<path
									d="M24 20.993V24H0v-2.996A14.977 14.977 0 0112.004 15c4.904 0 9.26 2.354 11.996 5.993zM16.002 8.999a4 4 0 11-8 0 4 4 0 018 0z"
								/>
							</svg>
						</span>
						<input
							type="file"
							id="image"
							name="image"
							accept="image/*"
							class="ml-5 bg-white py-2 px-3 border border-gray-300 rounded-md shadow-sm text-sm leading-4 font-medium text-gray-700 hover:bg-gray-50 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-500"
						/>
					</div>
				</div>

				<!-- Bouton de soumission -->
				<div class="flex justify-end">
					<button
						type="submit"
						class="inline-flex justify-center py-3 px-6 border border-transparent shadow-sm text-sm font-medium rounded-md text-white bg-blue-600 hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-500 transition-colors duration-200"
					>
						<svg
							xmlns="http://www.w3.org/2000/svg"
							class="h-5 w-5 mr-2"
							viewBox="0 0 20 20"
							fill="currentColor"
						>
							<path
								fill-rule="evenodd"
								d="M10 18a8 8 0 100-16 8 8 0 000 16zm3.707-9.293a1 1 0 00-1.414-1.414L9 10.586 7.707 9.293a1 1 0 00-1.414 1.414l2 2a1 1 0 001.414 0l4-4z"
								clip-rule="evenodd"
							/>
						</svg>
						Publier la recette
					</button>
				</div>
			</form>
		</div>
	</div>
</div>
{% endblock %}
