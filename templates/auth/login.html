{% extends 'base.html' %} {% block title %}Connexion{% endblock %} {% block
content %}
<div class="flex justify-center items-center my-10">
	<div class="max-w-md w-full">
		<div class="bg-white rounded-lg shadow-lg overflow-hidden">
			<div class="bg-gradient-to-r from-blue-600 to-blue-700 px-6 py-4">
				<h3 class="text-xl font-bold text-white">Connexion</h3>
			</div>
			<div class="p-6">
				<form method="POST" action="{{ url_for('login') }}">
					<div class="mb-5">
						<label
							for="username"
							class="block text-sm font-medium text-gray-700 mb-1"
							>Nom d'utilisateur</label
						>
						<input
							type="text"
							class="w-full rounded-md border-gray-300 shadow-sm focus:border-blue-500 focus:ring focus:ring-blue-500 focus:ring-opacity-50"
							id="username"
							name="username"
							required
						/>
					</div>
					<div class="mb-5">
						<label
							for="password"
							class="block text-sm font-medium text-gray-700 mb-1"
							>Mot de passe</label
						>
						<input
							type="password"
							class="w-full rounded-md border-gray-300 shadow-sm focus:border-blue-500 focus:ring focus:ring-blue-500 focus:ring-opacity-50"
							id="password"
							name="password"
							required
						/>
					</div>
					<div class="mb-5 flex items-center">
						<input
							type="checkbox"
							class="h-4 w-4 text-blue-600 border-gray-300 rounded focus:ring-blue-500"
							id="remember"
							name="remember"
						/>
						<label
							class="ml-2 block text-sm text-gray-700"
							for="remember"
							>Se souvenir de moi</label
						>
					</div>
					<button
						type="submit"
						class="w-full px-4 py-2 bg-blue-600 text-white rounded-md hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-500 transition-colors"
					>
						Se connecter
					</button>
				</form>
			</div>
			<div
				class="bg-gray-50 px-6 py-3 text-center text-sm text-gray-600 border-t"
			>
				Pas encore de compte?
				<a
					href="{{ url_for('register') }}"
					class="text-blue-600 hover:underline font-medium"
					>Inscrivez-vous</a
				>
			</div>
		</div>
	</div>
</div>
{% endblock %}
